[package]
name = "analytic-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
analytic-field = { path = "../field" }
spatial-math = { path = "../math" }
world-state = { path = "../world" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[dev-dependencies]
pollster = "=1.0.1"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
world-simulation = { path = "../simulation" }

[lints]
workspace = true
