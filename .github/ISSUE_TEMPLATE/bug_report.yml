name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact commands, inputs, revision, and environment
    validations:
      required: true
