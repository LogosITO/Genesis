version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
