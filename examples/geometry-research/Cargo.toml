[package]
name = "geometry-research"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
analytic-field = { path = "../../crates/field" }
analytic-renderer = { path = "../../crates/renderer" }
spatial-math = { path = "../../crates/math" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
pollster = "=1.0.1"

[lints]
workspace = true
